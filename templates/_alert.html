{% if messages %}
<div id="messages" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="public-message public-message--{{ message.tags|default:'info' }}">
        {% if message.level == DEFAULT_MESSAGE_LEVELS.ERROR %}
            <strong>Error:</strong>
        {% else %}
            <strong>{{ message.tags|title }}</strong>
        {% endif %}
        <span>{{ message }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
